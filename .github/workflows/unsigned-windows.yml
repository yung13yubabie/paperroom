name: Build unsigned Windows artifact
on:
  push:
    branches: ['dev/offline-workspace-handoff']
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Build and verify on Windows without uploading an artifact'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unsigned:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm source and install native toolchain
        run: |
          $head = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout differs from the event commit.' }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc

      - name: Test the release checker
        run: python -B ./scripts/test_windows_candidate.py

      - name: Run Windows tests with locked dependencies
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release EXE and capture restricted CRT evidence
        id: build
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          # Encoded flags replace, rather than extend, the target Cargo config.
          $flags = @('-C', 'target-feature=+crt-static', '-C', 'link-arg=/PDBALTPATH:%_PDB%')
          $roots = @{ '/paperroom' = $env:GITHUB_WORKSPACE; '/cargo' = $cargoHome; '/toolchain' = $rustupHome; '/build-temp' = $env:RUNNER_TEMP }
          foreach ($token in $roots.Keys | Sort-Object { $roots[$_].Length }) {
            $path = [IO.Path]::GetFullPath($roots[$token]).TrimEnd('\', '/')
            $flags += "--remap-path-prefix=$($path.Replace('/', '\'))=$token"
            $flags += "--remap-path-prefix=$($path.Replace('\', '/'))=$token"
          }
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]31
          $map = Join-Path $env:RUNNER_TEMP ('paperroom-' + [guid]::NewGuid().ToString('N') + '.map')
          $mapHash = 'unavailable'
          $crtEvidence = 'unresolved'
          try {
            cargo rustc --locked --release --target x86_64-pc-windows-msvc --bin paperroom -- -C "link-arg=/MAP:$map"
            if ($LASTEXITCODE -ne 0) { throw 'The Windows release build failed.' }
            $built = 'target/x86_64-pc-windows-msvc/release/paperroom.exe'
            $exeHash = (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash
            if (Test-Path -LiteralPath $map -PathType Leaf) {
              try {
                $mapHash = (Get-FileHash -LiteralPath $map -Algorithm SHA256).Hash
                $counts = [ordered]@{ libcmt = 0; libucrt = 0; libvcruntime = 0 }
                $pattern = '^\s*[0-9a-f]+:[0-9a-f]+\s+\S+\s+[0-9a-f]+\s+(?:[fi]\s+)*(libcmt|libucrt|libvcruntime)(?:\.lib)?:[A-Za-z0-9_.$-]+\.obj\s*$'
                foreach ($line in [IO.File]::ReadLines($map)) {
                  if ($line -match $pattern) { $counts[$Matches[1].ToLowerInvariant()]++ }
                }
                $parts = @($counts.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" })
                $status = if ($counts.Values -contains 0) { 'unresolved (one or more markers absent)' } else { 'markers observed (not a linked inventory)' }
                $crtEvidence = "$status; " + ($parts -join ', ')
              } catch {
                $crtEvidence = 'unresolved (map could not be inspected)'
              }
            }
            "exe_hash=$exeHash" >> $env:GITHUB_OUTPUT
            "map_hash=$mapHash" >> $env:GITHUB_OUTPUT
            "crt_evidence=$crtEvidence" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $map -PathType Leaf) {
              Remove-Item -LiteralPath $map -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $map -PathType Leaf) { throw 'Could not remove the private link map.' }
            }
          }

      - name: Verify and exercise the unsigned artifact
        id: verify
        env:
          BUILD_EXE_HASH: ${{ steps.build.outputs.exe_hash }}
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $package = @((ConvertFrom-Json $metadata).packages | Where-Object name -ceq 'paperroom')
          if ($package.Count -ne 1) { throw 'Expected one Paperroom package.' }
          $version = $package[0].version
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Expected a three-part release version.' }

          $built = 'target/x86_64-pc-windows-msvc/release/paperroom.exe'
          $builtHash = (Get-FileHash -LiteralPath $built -Algorithm SHA256).Hash
          if ($builtHash -cne $env:BUILD_EXE_HASH) { throw 'The executable differs from the recorded release build.' }
          $folder = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'paperroom-unsigned')
          $exe = Join-Path $folder.FullName 'Paperroom.exe'
          Copy-Item -LiteralPath $built -Destination $exe
          python ./scripts/windows-candidate.py audit $exe
          if ($LASTEXITCODE -ne 0) { throw 'Executable privacy audit failed.' }
          ./scripts/assert-windows-system-crt.ps1 -Exe $exe
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $fixedFile = $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart -join '.'
          $fixedProduct = $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart -join '.'
          if ($info.FileVersion -cne $version -or $info.ProductVersion -cne $version -or
              $fixedFile -ne "$version.0" -or $fixedProduct -ne "$version.0" -or
              $info.ProductName -cne 'Paperroom' -or $info.OriginalFilename -cne 'Paperroom.exe') {
            throw 'PE VERSIONINFO differs from the package.'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne 'NotSigned') {
            throw 'Expected an unsigned build.'
          }
          ./scripts/windows-storage.ps1 -Exe $exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($hash -cne $builtHash) { throw 'Staged executable differs from the build.' }
          $status = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $status) { throw 'Build or tests modified the checkout.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "exe_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload Paperroom.exe as the only archive member
        if: ${{ github.event_name == 'push' || !inputs.verify_only }}
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Paperroom-${{ steps.verify.outputs.version }}-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paperroom-unsigned/Paperroom.exe
          if-no-files-found: error

      - name: Record source and artifact identities
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          EXE_HASH: ${{ steps.verify.outputs.exe_hash }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARCHIVE_HASH: ${{ steps.upload.outputs.artifact-digest }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          MAP_HASH: ${{ steps.build.outputs.map_hash }}
          CRT_EVIDENCE: ${{ steps.build.outputs.crt_evidence }}
        run: |
          $summary = @(
            "Paperroom $env:VERSION unsigned Windows x64 (MSVC)"
            ''
            "- Repository: $env:GITHUB_REPOSITORY"
            "- Source commit: $env:GITHUB_SHA"
            "- Run: $env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)"
            "- Paperroom.exe SHA-256: $env:EXE_HASH"
            "- Private MSVC MAP SHA-256: $env:MAP_HASH"
            "- MSVC CRT public-symbol row counts: $env:CRT_EVIDENCE"
          )
          if ($env:VERIFY_ONLY -eq 'true') {
            $summary += '- Verification only. Artifact upload was skipped.'
          } else {
            if ($env:ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:ARCHIVE_HASH -notmatch '^[a-f0-9]{64}$') {
              throw 'GitHub did not return a valid artifact ID and archive digest.'
            }
            $summary += @(
              "- GitHub artifact ID: $env:ARTIFACT_ID"
              "- GitHub artifact ZIP SHA-256: $env:ARCHIVE_HASH"
            )
          }
          Write-Host "MSVC CRT public-symbol row counts for EXE SHA-256 $($env:EXE_HASH): $env:CRT_EVIDENCE; map SHA-256 $env:MAP_HASH"
          $summary >> $env:GITHUB_STEP_SUMMARY
