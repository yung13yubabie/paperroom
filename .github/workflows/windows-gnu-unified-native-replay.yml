name: Replay exact unified sources EXE on Windows
on:
  push:
    branches: ['dev/qa/unified-native-replay-20261126']

permissions:
  actions: read
  contents: read

env:
  PAPERROOM_SOURCE: 50dcb33c39b57e3b5111ca39dcc5d3f7181118cc
  PAPERROOM_EXE_SHA256: 1f927c94d0aee8570d928bc7e6df1326be27e435494eda29e4f9c12dcb1f1e20
  PAPERROOM_ZIP_SHA256: 46d90c672849f6a801a2bbd22a5e02f0d0edb22e8b68811d02982328b433d5e2

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the replay to the reviewed production source
        run: |
          git merge-base --is-ancestor $env:PAPERROOM_SOURCE HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The product revision is not an ancestor.' }
          $actual = @(git diff --name-only $env:PAPERROOM_SOURCE HEAD)
          $allowed = @('.github/workflows/windows-gnu-unified-draft.yml','.github/workflows/windows-gnu-unified-native-replay.yml','scripts/windows-unified-sources.ps1')
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $allowed.Count -or @($actual | Where-Object { $_ -cnotin $allowed }).Count) {
            throw 'Replay checkout differs outside the reviewed QA files.'
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Paperroom-unified-sources-windows-x64-gnu-draft
          path: ${{ runner.temp }}/unified-draft
          run-id: 45754224653
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Paperroom-unified-sources-GNU-draft-exe
          path: ${{ runner.temp }}/unified-exe
          run-id: 45754224653
          github-token: ${{ github.token }}
      - name: Verify both original artifacts and complete the GUI workflow
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'unified-draft'
          $zip = Join-Path $base 'Paperroom-unified-sources-windows-x64-gnu-draft.zip'
          python -B scripts/package-windows-gnu-audit.py verify --package $zip --commit $env:PAPERROOM_SOURCE --exe-sha256 $env:PAPERROOM_EXE_SHA256 --zip-sha256 $env:PAPERROOM_ZIP_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded package failed verification.' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $base 'verified')
          $exe = Join-Path $base 'verified/Paperroom.exe'
          $standalone = Join-Path $env:RUNNER_TEMP 'unified-exe/Paperroom.exe'
          if ((Get-FileHash -LiteralPath $exe).Hash -ine $env:PAPERROOM_EXE_SHA256 -or
              (Get-FileHash -LiteralPath $standalone).Hash -ine $env:PAPERROOM_EXE_SHA256) {
            throw 'The originally uploaded EXEs differ.'
          }
          $env:PAPERROOM_UNIFIED_RECEIPT = Join-Path $base 'unified-reopen-restore.json'
          ./scripts/windows-highlight-workflow.ps1 -Exe $exe -ExeSha256 $env:PAPERROOM_EXE_SHA256 -UnifiedSourcesOnly
          if (!(Test-Path -LiteralPath $env:PAPERROOM_UNIFIED_RECEIPT -PathType Leaf)) {
            throw 'Missing native unified-workspace receipt.'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Paperroom-unified-draft-native-replay
          path: ${{ runner.temp }}/unified-draft/unified-reopen-restore.json
          if-no-files-found: error
