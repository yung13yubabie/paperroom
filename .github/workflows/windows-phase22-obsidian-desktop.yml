name: Verify official Obsidian Canvas media round trip
on:
  push:
    branches: ['dev/qa/phase22-obsidian-media-canvas-20261126']
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'yung13yubabie/paperroom'
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Move a native Canvas card and reopen its media fixture
        shell: pwsh
        env:
          OBSIDIAN_RECEIPTS: ${{ runner.temp }}/obsidian-synthetic-receipts
        run: pwsh -STA -NoProfile -File ./scripts/windows-phase22-obsidian-desktop.ps1
      - name: Preserve only synthetic desktop receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidian-1.15.1-canvas-media-roundtrip
          path: ${{ runner.temp }}/obsidian-synthetic-receipts
          if-no-files-found: warn
          retention-days: 14
