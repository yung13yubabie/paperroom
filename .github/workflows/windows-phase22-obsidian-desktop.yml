name: Verify independent official Obsidian Canvas Bases pins
on:
  push:
    branches: ['dev/qa/phase24-obsidian-base-pin-20261126']
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'yung13yubabie/paperroom'
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin distinct named Base views on two actual Canvas cards
        shell: pwsh
        env:
          OBSIDIAN_RECEIPTS: ${{ runner.temp }}/obsidian-synthetic-receipts
        run: pwsh -STA -NoProfile -File ./scripts/windows-phase22-obsidian-desktop.ps1
      - name: Preserve only synthetic desktop receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsidian-1.15.1-independent-base-pins
          path: ${{ runner.temp }}/obsidian-synthetic-receipts
          if-no-files-found: warn
          retention-days: 14
