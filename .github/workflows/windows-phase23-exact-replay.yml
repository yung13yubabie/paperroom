name: Verify exact Paperroom GUI and official Obsidian Canvas interchange
on:
  push:
    branches: ['dev/qa/phase23-exact-windows']

permissions:
  actions: read
  contents: read

env:
  PAPERROOM_SOURCE: 182b70c82438b0abd4e5376ff947faf10d6657d5
  PAPERROOM_EXE_SHA256: 2a17de667bb2e96c290226d7a83aaf4325c1a1262765eb456f96fdaedac5fd98
  PAPERROOM_ZIP_SHA256: 8730eaba4dd1f684de0deef946b29aa6c46228ca01d90753d866e007bc48af60

jobs:
  native:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        flow: [companion, vendor]
    timeout-minutes: 12
    env:
      FLOW: ${{ matrix.flow }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the replay to the reviewed production source
        run: |
          git merge-base --is-ancestor $env:PAPERROOM_SOURCE HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The product revision is not an ancestor.' }
          $actual = @(git diff --name-only a792acbc227a8743c7eb7ad7ef64e6ed409d2663 HEAD)
          $allowed = @('.github/workflows/windows-phase23-exact-replay.yml','scripts/windows-companion-placement.ps1','scripts/windows-highlight-workflow.ps1','scripts/windows-vendor-canvas-replay.ps1')
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne $allowed.Count -or @($actual | Where-Object { $_ -cnotin $allowed }).Count) {
            throw 'Replay checkout differs outside the reviewed QA files.'
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Paperroom-live-bases-windows-x64-gnu-draft
          path: ${{ runner.temp }}/unified-draft
          run-id: 45760949429
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Paperroom-live-bases-GNU-draft-exe
          path: ${{ runner.temp }}/unified-exe
          run-id: 45760949429
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.flow == 'vendor'
        with:
          name: obsidian-1.15.1-synthetic-runtime
          path: ${{ runner.temp }}/verified-vendor
          run-id: 45760478653
          github-token: ${{ github.token }}
      - name: Verify both original artifacts and complete the GUI workflow
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'unified-draft'
          $zip = Join-Path $base 'Paperroom-live-bases-windows-x64-gnu-draft.zip'
          python -B scripts/package-windows-gnu-audit.py verify --package $zip --commit $env:PAPERROOM_SOURCE --exe-sha256 $env:PAPERROOM_EXE_SHA256 --zip-sha256 $env:PAPERROOM_ZIP_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded package failed verification.' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $base 'verified')
          $exe = Join-Path $base 'verified/Paperroom.exe'
          $standalone = Join-Path $env:RUNNER_TEMP 'unified-exe/Paperroom.exe'
          if ((Get-FileHash -LiteralPath $exe).Hash -ine $env:PAPERROOM_EXE_SHA256 -or
              (Get-FileHash -LiteralPath $standalone).Hash -ine $env:PAPERROOM_EXE_SHA256) {
            throw 'The originally uploaded EXEs differ.'
          }
          $env:PAPERROOM_UNIFIED_RECEIPT = Join-Path $base 'companion-exact-receipt.json'
          $env:PAPERROOM_VERIFIED_VENDOR_CANVAS = Join-Path $env:RUNNER_TEMP 'verified-vendor/Canvas-saved.canvas'
          $scenario = if ($env:FLOW -eq 'vendor') { @{VendorCanvasOnly=$true} } else { @{CompanionPlacementOnly=$true} }
          ./scripts/windows-highlight-workflow.ps1 -Exe $exe -ExeSha256 $env:PAPERROOM_EXE_SHA256 @scenario
          if (!(Test-Path -LiteralPath $env:PAPERROOM_UNIFIED_RECEIPT -PathType Leaf)) {
            throw 'Missing native unified-workspace receipt.'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Paperroom-23-exact-replay-${{ matrix.flow }}
          path: ${{ runner.temp }}/unified-draft/companion-exact-receipt.json
          if-no-files-found: error
