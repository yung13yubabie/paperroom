name: Windows storage checks
on:
  push:
    paths-ignore:
      - '.github/workflows/draft-windows-acceptance.yml'
      - 'docs/WINDOWS-DRAFT-QA.md'
      - 'scripts/windows-about-notices.ps1'
      - 'scripts/windows-highlight-workflow.ps1'
      - 'scripts/verify-windows-notice-bundle.py'
      - 'scripts/test_windows_notice_bundle.py'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public release tag to verify (leave blank for native source tests)'
        type: string
        required: false
  release:
    types: [published]
permissions:
  contents: read
jobs:
  storage:
    # The acceptance-only change verifies the pinned candidate without rebuilding it.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')) &&
      !(github.event_name == 'push' && github.repository == 'yung13yubabie/paperroom' &&
      github.ref == 'refs/heads/dev/offline-workspace-handoff' &&
      github.event.before == 'acdffdffaa10f9919d39494a14de6d83517484fc' &&
      github.event.head_commit.message == 'Verify pinned Windows candidate GUI and notice bundle')
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use the release Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          rustup target add x86_64-pc-windows-msvc
      - name: Run native Rust tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Windows x64 smoke-test binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Check the candidate for VC runtime DLL imports
        shell: pwsh
        run: ./scripts/assert-windows-system-crt.ps1 -Exe ./target/x86_64-pc-windows-msvc/release/paperroom.exe
      - name: Fetch and verify the pinned public v0.1.1 upgrade baseline
        id: legacy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Join-Path $env:RUNNER_TEMP ('paperroom-v011-' + [guid]::NewGuid())
          [void][System.IO.Directory]::CreateDirectory($legacy)
          try {
            $exe = Join-Path $legacy 'Paperroom.exe'
            Invoke-WebRequest -Uri 'https://github.com/yung13yubabie/paperroom/releases/download/v0.1.1/Paperroom.exe' -OutFile $exe -TimeoutSec 45
            $sha = '0b281c84d7cf82c03c6262307a2b5b3585ba180e107119dc02b7518f1473de82'
            if ((Get-FileHash -LiteralPath $exe).Hash -ine $sha) { throw 'Public v0.1.1 baseline digest differs.' }
            "exe=$exe" >> $env:GITHUB_OUTPUT
          } catch {
            Remove-Item -LiteralPath $legacy -Recurse -Force
            throw
          }
      - name: Exercise first launch, crash recovery and upgrade from published v0.1.1
        shell: pwsh
        env:
          V011_BASELINE: ${{ steps.legacy.outputs.exe }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:V011_BASELINE) -or
              !(Test-Path -LiteralPath $env:V011_BASELINE -PathType Leaf)) {
            throw 'Pinned public upgrade baseline is required for this check.'
          }
          try {
            ./scripts/windows-storage.ps1 -Exe ./target/x86_64-pc-windows-msvc/release/paperroom.exe -UpgradeBaseline $env:V011_BASELINE
          } finally {
            Remove-Item -LiteralPath $env:V011_BASELINE -Force
            Remove-Item -LiteralPath (Split-Path $env:V011_BASELINE -Parent)
          }

  release-assets:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
      (github.ref == 'refs/heads/maintenance/signing-preparation' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - name: Resolve the tag and verify public downloads
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'paperroom-release-check'
          python ./scripts/verify-release.py "$env:GITHUB_REPOSITORY" "$env:RELEASE_TAG" "$folder"
          if ($LASTEXITCODE -ne 0) { throw 'Public release verification failed.' }

      - name: Smoke-test the verified public Windows EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'paperroom-release-check/Paperroom.exe'
          $screenshot = Join-Path $env:RUNNER_TEMP 'paperroom-first-window.png'
          ./scripts/windows-storage.ps1 -Exe $exe -Screenshot $screenshot

      - name: Attach captured release window
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paperroom-windows-first-window
          path: ${{ runner.temp }}/paperroom-first-window.png
          if-no-files-found: warn
          retention-days: 7
