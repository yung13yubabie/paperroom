name: Windows storage checks
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public release tag to verify (leave blank for native source tests)'
        type: string
        required: false
  release:
    types: [published]
permissions:
  contents: read
jobs:
  storage:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use the release Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
          rustup target add x86_64-pc-windows-msvc
      - name: Run native Rust tests
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build Windows x64 smoke-test binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Exercise first launch and crash recovery
        shell: pwsh
        run: ./scripts/windows-storage.ps1 -Exe ./target/x86_64-pc-windows-msvc/release/paperroom.exe

  release-assets:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/maintenance/signing-preparation')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the tag and verify public downloads
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'v0.1.1' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'paperroom-release-check'
          python ./scripts/verify-release.py "$env:GITHUB_REPOSITORY" "$env:RELEASE_TAG" "$folder"
          if ($LASTEXITCODE -ne 0) { throw 'Public release verification failed.' }

      - name: Smoke-test the verified public Windows EXE
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'paperroom-release-check/Paperroom.exe'
          $screenshot = Join-Path $env:RUNNER_TEMP 'paperroom-first-window.png'
          ./scripts/windows-storage.ps1 -Exe $exe -Screenshot $screenshot

      - name: Attach captured release window
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paperroom-windows-first-window
          path: ${{ runner.temp }}/paperroom-first-window.png
          if-no-files-found: warn
          retention-days: 7
