[package]
name = "paperroom"
version = "0.1.2"
edition = "2024"

[dependencies]
yaml-rust2 = { version = "=0.13.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
hayro = { version = "=0.9.0", features = ["embed-fonts"] }
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[build-dependencies]
cc = "1.11.3"
